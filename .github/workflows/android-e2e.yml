name: Android Appium E2E Enterprise Automation & GitHub Pages Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Daily midnight run

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android-e2e-automation:
    name: 📱 Android Appium E2E Execution & Reporting
    runs-on: macos-latest # Using macOS runner for optimal hardware acceleration & Android emulator stability

    steps:
      # Stage 1: Checkout Repository
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      # Stage 2: Setup Java
      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Stage 3: Setup Android SDK
      - name: 3. Setup Android SDK
        uses: android-actions/setup-android@v3

      # Stage 4: Install Python & Node.js Dependencies
      - name: 4. Install Node.js & Python Environments
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'app/appium-test/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl jinja2 pandas requests pytest Appium-Python-Client
          if [ -f app/appium-test/requirements.txt ]; then pip install -r app/appium-test/requirements.txt; fi

      # Stage 5: Build APK
      - name: 5. Build Android Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # Stage 6 & 7: Start Android Emulator & Verify Readiness
      - name: 6 & 7. Launch Android Emulator & Verify Readiness
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-load -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
          disable-animations: true
          script: |
            echo "Stage 7: Verifying Emulator Readiness..."
            adb wait-for-device
            adb shell getprop sys.boot_completed

            echo "Stage 8: Install APK on Emulator..."
            if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
              adb install -r app/build/outputs/apk/debug/app-debug.apk
            else
              echo "Warning: APK file not found at expected path. Proceeding with installed package checks."
            fi

            echo "Stage 9: Start Appium Server..."
            npm install -g appium
            appium driver install uiautomator2 || true
            appium --log app/appium-test/Test\ Results/Logs/appium.log &
            
            echo "Stage 10: Verify Appium Health..."
            sleep 10
            curl -s http://127.0.0.1:4723/status || echo "Appium status check warning"

            echo "Stage 11: Execute Appium E2E Tests (400+ Test Suite)..."
            python app/appium-test/generate_400_test_data.py
            pytest app/appium-test/tests/ -v --junitxml=app/appium-test/Test\ Results/junit.xml || true

            echo "Stage 12 & 13: Capture Screenshots & Device Logs..."
            mkdir -p app/appium-test/Test\ Results/Logs
            mkdir -p app/appium-test/Test\ Results/Screenshots
            adb logcat -d > app/appium-test/Test\ Results/Logs/device.log || true

            echo "Stage 14, 15, 16, 17: Generate Multi-Format Enterprise Reports..."
            python app/appium-test/generate_enterprise_reports.py

            echo "Stage 20: Structure Reports for GitHub Pages Archiving..."
            python scripts/publish_gh_pages.py

      # Stage 18: Upload Artifacts & Zip Package
      - name: 18. Upload E2E Test Artifacts & Zip Package
        uses: actions/upload-artifact@v4
        with:
          name: SmileApp-Android-Appium-E2E-Test-Report
          path: |
            app/appium-test/Test Results/
            SmileApp_Android_Appium_E2E_Test_Artifacts.zip
            app/appium-test/SmileApp_E2E_Test_Report.xlsx
            app/appium-test/SmileApp_E2E_Test_Report.html
          retention-days: 30

      # Stage 19: Publish Reports to GitHub Pages
      - name: 19. Deploy Reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public_reports
          keep_files: true

      # Stage 21: Publish GitHub Action Summary
      - name: 21. Publish GitHub Action Summary
        if: always()
        run: |
          if [ -f "app/appium-test/Test Results/Summary/summary.md" ]; then
            cat "app/appium-test/Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          elif [ -f "app/appium-test/summary.md" ]; then
            cat "app/appium-test/summary.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "# Android Appium Execution Complete" >> $GITHUB_STEP_SUMMARY
          fi
