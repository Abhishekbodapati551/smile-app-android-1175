name: Phase 7 - Deploy & Live Selenium E2E Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy-and-test:
    runs-on: ubuntu-latest
    steps:
      # Stage 1: Repository Checkout
      - name: Stage 1 - Repository Checkout
        uses: actions/checkout@v4

      # Stage 2: Dependency Installation
      - name: Stage 2 - Set up Python & Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stage 2 - Install Chrome & Automation Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt

      # Stage 3: Build Application
      - name: Stage 3 - Build Application
        run: |
          echo "Building static web application..."
          test -f index.html || (echo "index.html missing!" && exit 1)

      # Stage 4: Static Analysis
      - name: Stage 4 - Static Analysis & Linting
        run: |
          echo "Executing Static Analysis on application assets..."
          python -c "import html.parser; html.parser.HTMLParser().feed(open('index.html').read())"

      # Stage 5: Deploy to GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Stage 5 - Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Stage 6: Wait for Deployment
      - name: Stage 6 - Wait for Deployment Availability
        run: |
          echo "Waiting 15 seconds for GitHub Pages DNS & static asset caching..."
          sleep 15

      # Stage 7: Deployment Verification
      - name: Stage 7 - Deployment Verification
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Verifying live deployment at: $BASE_URL"
          python automation/utils/deployment_verifier.py

      # Stage 8: Run Selenium E2E Tests
      - name: Stage 8 - Run Selenium E2E Tests (Headless Chrome)
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
          HEADLESS: "true"
          PASS_THRESHOLD_PERCENT: "95.0"
        run: |
          python automation/run_tests.py

      # Stage 9 & 10: Generate Reports & Excel Reports (Executed inside run_tests.py)
      - name: Stage 9 & 10 - Verify Generated Reports
        if: always()
        run: |
          ls -la automation/reports/Excel/
          ls -la automation/reports/HTML/
          ls -la automation/reports/JSON/
          ls -la automation/reports/Summary/

      # Stage 11: Upload Artifacts
      - name: Stage 11 - Upload Automation & Execution Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smileapp-e2e-automation-reports
          path: |
            automation/reports/
            automation/screenshots/
            automation/logs/
            smileapp-e2e-automation.zip
          retention-days: 30

      # Stage 12: Publish Summary
      - name: Stage 12 - Publish GitHub Action Execution Summary
        if: always()
        run: |
          if [ -f automation/reports/Summary/summary.md ]; then
            cat automation/reports/Summary/summary.md >> $GITHUB_STEP_SUMMARY
          fi

      # Stage 13: Store Historical Results
      - name: Stage 13 - Store Historical Execution Results
        if: always()
        run: |
          echo "Execution results archived in workflow artifacts and step summary."
