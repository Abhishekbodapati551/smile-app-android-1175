name: Phase 7 - Complete CI/CD Deployment & Live E2E Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy-and-test:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Stage 1: Repository Checkout
      - name: Stage 1 - Repository Checkout
        uses: actions/checkout@v4

      # Stage 2: Dependency Installation
      - name: Stage 2 - Set up Python & Automation Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stage 2 - Install Chrome & Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt

      # Stage 3: Build Application
      - name: Stage 3 - Build Application Assets
        run: |
          echo "Building static Web Dashboard application..."
          test -f index.html || (echo "index.html is missing!" && exit 1)

      # Stage 4: Static Analysis
      - name: Stage 4 - Static Analysis & HTML Linting
        run: |
          echo "Performing Static Analysis..."
          python -c "import html.parser; html.parser.HTMLParser().feed(open('index.html', encoding='utf-8').read())"

      # Stage 5: Deploy to GitHub Pages
      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Stage 5 - Deploy Application to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Stage 6: Wait for Deployment
      - name: Stage 6 - Wait for Deployment Propagation
        run: |
          echo "Waiting 15 seconds for DNS propagation and static asset deployment..."
          sleep 15

      # Stage 7: Deployment Verification
      - name: Stage 7 - Deployment Verification (HTTP 200 & Asset Check)
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Verifying live deployment availability at: $BASE_URL"
          python automation/utils/deployment_verifier.py

      # Stage 8: Run Selenium E2E Tests
      - name: Stage 8 - Execute Headless Selenium E2E Test Suite (400+ Test Cases)
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
          HEADLESS: "true"
          PASS_THRESHOLD_PERCENT: "95.0"
        run: |
          python automation/run_tests.py

      # Stage 9: Generate Reports
      - name: Stage 9 - Verify Generated HTML & JSON Reports
        if: always()
        run: |
          echo "Verifying generated HTML and JSON report files..."
          ls -la automation/reports/HTML/
          ls -la automation/reports/JSON/

      # Stage 10: Generate Excel Reports
      - name: Stage 10 - Verify Generated Excel Reports
        if: always()
        run: |
          echo "Verifying generated Excel report files..."
          ls -la automation/reports/Excel/

      # Stage 11: Upload Artifacts
      - name: Stage 11 - Upload Automation Zip Reports & Evidence Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smileapp-e2e-automation-reports-zip
          path: |
            smileapp-e2e-automation.zip
            automation/reports/
            automation/screenshots/
            automation/logs/
          retention-days: 30

      # Stage 12: Publish Summary
      - name: Stage 12 - Publish GitHub Action Execution Summary
        if: always()
        run: |
          if [ -f automation/reports/Summary/summary.md ]; then
            cat automation/reports/Summary/summary.md >> $GITHUB_STEP_SUMMARY
          fi

      # Stage 13: Store Historical Results
      - name: Stage 13 - Store Historical Test Execution Results
        if: always()
        run: |
          echo "Test execution results successfully stored in workflow artifacts and step summaries."
