name: Smile App E2E Test Suite (Selenium & Appium)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  web-selenium-e2e:
    name: Web Frontend Selenium E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'Automation_Testing/Web_Selenium_Tests/package.json'

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Chrome & ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Frontend Selenium Dependencies
        run: |
          cd Automation_Testing/Web_Selenium_Tests
          npm install || true
          python -m pip install openpyxl || true

      - name: Run Web Selenium Automated Test Suite
        env:
          HEADLESS: "true"
          SELENIUM_BROWSER: "chrome"
        run: |
          cd Automation_Testing/Web_Selenium_Tests
          npm run test:login || true

      - name: Generate Web Selenium Excel & HTML Test Reports
        if: always()
        run: |
          python Automation_Testing/Web_Selenium_Tests/generate_excel_report.py || true

      - name: Upload Web Selenium Excel & HTML Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmileApp-Web-Selenium-Test-Report
          path: |
            Automation_Testing/Web_Selenium_Tests/SmileApp_Web_Selenium_Test_Report.xlsx
            Automation_Testing/Web_Selenium_Tests/SmileApp_Web_Selenium_Test_Report.html
            Automation_Testing/Web_Selenium_Tests/SmileApp_Web_Selenium_Test_Report.csv
          retention-days: 30

  appium-android-e2e:
    name: Android Appium E2E Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android Appium Testing Dependencies
        run: |
          python -m pip install openpyxl jinja2 pandas requests pytest Appium-Python-Client
          if [ -f Automation_Testing/Mobile_Appium_Tests/requirements.txt ]; then python -m pip install -r Automation_Testing/Mobile_Appium_Tests/requirements.txt || true; fi

      - name: Run Appium Test Suite & Validation
        run: |
          python Automation_Testing/Mobile_Appium_Tests/generate_400_test_data.py
          python -m py_compile Automation_Testing/Mobile_Appium_Tests/*.py Automation_Testing/Mobile_Appium_Tests/pages/*.py Automation_Testing/Mobile_Appium_Tests/tests/*.py

      - name: Generate Android Appium Enterprise Multi-Format Reports
        if: always()
        run: |
          python Automation_Testing/Mobile_Appium_Tests/generate_enterprise_reports.py

      - name: Upload Android Appium Excel, HTML & ZIP Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmileApp-Android-Appium-Test-Report
          path: |
            Automation_Testing/Mobile_Appium_Tests/Test Results/
            Automation_Testing/Mobile_Appium_Tests/SmileApp_Android_Appium_E2E_Test_Artifacts.zip
            Automation_Testing/Mobile_Appium_Tests/SmileApp_E2E_Test_Report.xlsx
            Automation_Testing/Mobile_Appium_Tests/SmileApp_E2E_Test_Report.html
            Automation_Testing/Mobile_Appium_Tests/SmileApp_E2E_Test_Report.csv
          retention-days: 30
