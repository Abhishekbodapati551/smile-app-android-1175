[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -vs --tb=short
markers =
    smoke: Smoke tests for critical user journeys
    regression: Full regression test suite
    auth: Authentication and registration tests
    child: Child workspace and timer tests
    doctor: Doctor workspace and patient management tests
    integration: Database sync and edge cases tests
